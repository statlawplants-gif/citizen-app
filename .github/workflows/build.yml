name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build APK using official Kivy Buildozer Action
      uses: kivy/buildozer-action@v1
      with:
        command: android debug
        requirements: python3,kivy,requests,urllib3,chardet,idna,certifi
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: citizen-app-apk
        path: bin/*.apk
