name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android SDK Components Manually
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config python3-dev libffi-dev libssl-dev zlib1g-dev lib32z1 lib32stdc++6
    
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36
    
    - name: Build APK with Manual Path Override
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        # اضافه کردن مسیر دقیق build-tools به PATH برای پیدا شدن aidl
        export PATH=$ANDROID_HOME/build-tools/34.0.0:$PATH
        buildozer android debug
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: citizen-app-apk
        path: bin/*.apk
